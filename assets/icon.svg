<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c12"/>
      <stop offset="100%" stop-color="#020305"/>
    </linearGradient>

    <!-- Selected Card Gradient -->
    <linearGradient id="heroCardFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3ca2d2"/>
      <stop offset="45%" stop-color="#2f8fbd"/>
      <stop offset="100%" stop-color="#1e6b91"/>
    </linearGradient>

    <!-- Glowing Border Filter -->
    <filter id="heroGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#9ad9ff" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.85"/>
    </filter>

    <filter id="backShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Outer Squircle Tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#iconBg)" stroke="#222b38" stroke-width="2.5"/>

  <!-- Subtle Cyan Ambient Light Spill -->
  <circle cx="256" cy="260" r="140" fill="#2f8fbd" opacity="0.2" filter="blur(60px)"/>

  <!-- Back Card: Represents the "Deck" Layer (Pure Black #000000, Slate Border #5c6e82) -->
  <g transform="rotate(7 320 230)" filter="url(#backShadow)">
    <rect x="150" y="85" width="250" height="315" rx="26" fill="#000000" stroke="#5c6e82" stroke-width="3.5"/>
    <!-- Top-Right Badge: "2" -->
    <rect x="336" y="100" width="48" height="38" rx="10" fill="#24303d"/>
    <text x="360" y="126" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="800" text-anchor="middle">2</text>
    <!-- Muted Card Lines -->
    <line x1="185" y1="165" x2="310" y2="165" stroke="#475569" stroke-width="9" stroke-linecap="round"/>
    <line x1="185" y1="198" x2="275" y2="198" stroke="#334155" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- Front Card: The Active Prompt Card (Selected #2f8fbd + Glowing #9ad9ff Border) -->
  <g filter="url(#heroGlow)">
    <!-- Main Card Body -->
    <rect x="100" y="105" width="265" height="325" rx="28" fill="url(#heroCardFill)" stroke="#9ad9ff" stroke-width="5"/>

    <!-- Dark Number Badge in Top-Right ("1") -->
    <rect x="296" y="122" width="52" height="42" rx="12" fill="#143c50"/>
    <text x="322" y="151" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="900" text-anchor="middle">1</text>

    <!-- Bold Dark Title ("PROMPT") -->
    <text x="135" y="156" fill="#061824" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="900" letter-spacing="0.5">PROMPT</text>

    <!-- Prompt Snippet Lines (Mirroring actual prompt text structure) -->
    <line x1="135" y1="200" x2="330" y2="200" stroke="#061824" stroke-width="11" stroke-linecap="round" opacity="0.95"/>
    <line x1="135" y1="238" x2="330" y2="238" stroke="#061824" stroke-width="11" stroke-linecap="round" opacity="0.95"/>
    <line x1="135" y1="276" x2="285" y2="276" stroke="#061824" stroke-width="11" stroke-linecap="round" opacity="0.85"/>
    <line x1="135" y1="314" x2="330" y2="314" stroke="#061824" stroke-width="11" stroke-linecap="round" opacity="0.85"/>
    <line x1="135" y1="352" x2="310" y2="352" stroke="#061824" stroke-width="11" stroke-linecap="round" opacity="0.75"/>
    <line x1="135" y1="390" x2="240" y2="390" stroke="#061824" stroke-width="11" stroke-linecap="round" opacity="0.65"/>
  </g>
</svg>
