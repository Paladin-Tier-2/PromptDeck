<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%">
  <defs>
    <!-- Dark Background Gradient -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14"/>
      <stop offset="50%" stop-color="#050609"/>
      <stop offset="100%" stop-color="#020305"/>
    </linearGradient>

    <!-- Card 1 Selected Fill (#2f8fbd) -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3ba5d6"/>
      <stop offset="48%" stop-color="#2f8fbd"/>
      <stop offset="100%" stop-color="#195c80"/>
    </linearGradient>

    <!-- Card 1 Glowing Aura -->
    <filter id="bannerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#9ad9ff" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.9"/>
    </filter>

    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Banner Background -->
  <rect width="1200" height="520" fill="url(#bannerBg)"/>

  <!-- Subtle Ambient Glows -->
  <circle cx="850" cy="260" r="280" fill="#2f8fbd" opacity="0.18" filter="blur(90px)"/>
  <circle cx="200" cy="180" r="180" fill="#9ad9ff" opacity="0.08" filter="blur(80px)"/>

  <!-- ==================== LEFT SIDE: BRANDING & HEADLINE ==================== -->
  <g transform="translate(100, 180)">
    <!-- Main Title -->
    <text x="0" y="45" fill="#ffffff" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="58" font-weight="900" letter-spacing="-1.5">PromptDeck</text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="96" fill="#cbd5e1" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="20" font-weight="500">A keyboard-first prompt picker for Linux &amp; Windows.</text>
    <text x="0" y="130" fill="#64748b" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" font-weight="400">Opens instantly over your screen, copies a prompt, and vanishes.</text>
  </g>

  <!-- ==================== RIGHT SIDE: THE AUTHENTIC 4-CARD UI GRID ==================== -->
  <g transform="translate(590, 45)">
    <!-- Window Backdrop Container -->
    <rect x="0" y="0" width="510" height="430" rx="24" fill="#030406" stroke="#1a222d" stroke-width="2"/>

    <!-- Deck Pill: "AI · 1/5" -->
    <rect x="28" y="22" width="86" height="24" rx="8" fill="#080b10" stroke="#374354" stroke-width="1.5"/>
    <text x="71" y="38.5" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">AI · 1/5</text>

    <!-- Card 1: Selected Card (#2f8fbd) -->
    <g filter="url(#bannerGlow)">
      <rect x="28" y="58" width="215" height="165" rx="16" fill="url(#cardGrad)" stroke="#9ad9ff" stroke-width="2.5"/>
      <rect x="195" y="70" width="32" height="24" rx="6" fill="#143c50"/>
      <text x="211" y="87" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">1</text>
      <text x="46" y="92" fill="#061824" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="900">TONE</text>
      <line x1="46" y1="112" x2="215" y2="112" stroke="#061824" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
      <line x1="46" y1="128" x2="215" y2="128" stroke="#061824" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
      <line x1="46" y1="144" x2="195" y2="144" stroke="#061824" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
      <line x1="46" y1="160" x2="208" y2="160" stroke="#061824" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
      <line x1="46" y1="176" x2="160" y2="176" stroke="#061824" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
      <line x1="46" y1="192" x2="130" y2="192" stroke="#061824" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    </g>

    <!-- Card 2: Email Tone -->
    <g filter="url(#cardShadow)">
      <rect x="265" y="58" width="215" height="165" rx="16" fill="#000000" stroke="#5c6e82" stroke-width="2"/>
      <rect x="432" y="70" width="32" height="24" rx="6" fill="#24303d"/>
      <text x="448" y="87" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">2</text>
      <text x="283" y="92" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="800">Email Tone</text>
      <line x1="283" y1="112" x2="452" y2="112" stroke="#e2e8f0" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
      <line x1="283" y1="128" x2="440" y2="128" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" opacity="0.5"/>
      <line x1="283" y1="144" x2="452" y2="144" stroke="#64748b" stroke-width="3.5" stroke-linecap="round" opacity="0.45"/>
      <line x1="283" y1="160" x2="410" y2="160" stroke="#64748b" stroke-width="3.5" stroke-linecap="round" opacity="0.4"/>
      <line x1="283" y1="176" x2="425" y2="176" stroke="#475569" stroke-width="3.5" stroke-linecap="round" opacity="0.35"/>
      <line x1="283" y1="192" x2="370" y2="192" stroke="#475569" stroke-width="3.5" stroke-linecap="round" opacity="0.3"/>
    </g>

    <!-- Card 3: Problem Set Tutor -->
    <g filter="url(#cardShadow)">
      <rect x="28" y="240" width="215" height="165" rx="16" fill="#000000" stroke="#5c6e82" stroke-width="2"/>
      <rect x="195" y="252" width="32" height="24" rx="6" fill="#24303d"/>
      <text x="211" y="269" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">3</text>
      <text x="46" y="274" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="800">Problem Set Tutor</text>
      <line x1="46" y1="294" x2="215" y2="294" stroke="#e2e8f0" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
      <line x1="46" y1="310" x2="200" y2="310" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" opacity="0.5"/>
      <line x1="46" y1="326" x2="215" y2="326" stroke="#64748b" stroke-width="3.5" stroke-linecap="round" opacity="0.45"/>
      <line x1="46" y1="342" x2="190" y2="342" stroke="#64748b" stroke-width="3.5" stroke-linecap="round" opacity="0.4"/>
      <line x1="46" y1="358" x2="170" y2="358" stroke="#475569" stroke-width="3.5" stroke-linecap="round" opacity="0.35"/>
    </g>

    <!-- Card 4: Code Commenting -->
    <g filter="url(#cardShadow)">
      <rect x="265" y="240" width="215" height="165" rx="16" fill="#000000" stroke="#5c6e82" stroke-width="2"/>
      <rect x="432" y="252" width="32" height="24" rx="6" fill="#24303d"/>
      <text x="448" y="269" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">4</text>
      <text x="283" y="274" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="800">Code Commenting</text>
      <line x1="283" y1="294" x2="452" y2="294" stroke="#e2e8f0" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
      <line x1="283" y1="310" x2="430" y2="310" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" opacity="0.5"/>
      <line x1="283" y1="326" x2="452" y2="326" stroke="#64748b" stroke-width="3.5" stroke-linecap="round" opacity="0.45"/>
      <line x1="283" y1="342" x2="390" y2="342" stroke="#64748b" stroke-width="3.5" stroke-linecap="round" opacity="0.4"/>
      <line x1="283" y1="358" x2="415" y2="358" stroke="#475569" stroke-width="3.5" stroke-linecap="round" opacity="0.35"/>
    </g>
  </g>
</svg>
